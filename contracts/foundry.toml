[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The plan §7.4 interface (createGame emitting the 8-field GameCreated) is "stack too deep"
# on the legacy pipeline even with an empty body.
via_ir = true
# Tests read packages/shared/src/tuning.json and the test fixture table.
fs_permissions = [{ access = "read", path = "../packages/shared" }]
