# Fly.io configuration of the game server (docs/deploy-monad.md). Any host that runs the
# Dockerfile as ONE long-lived container with a persistent volume at /data works the same way.
#
#   fly apps create <app>                     and set `app` below
#   fly volumes create maze_data --size 1 --region <primary_region>
#   fly secrets import < .env.monad.server    (written by `pnpm monad:server-env`)
#   fly deploy
#
# Never more than one machine: the event log on the volume is the server's whole state, and a
# second server would issue tickets and sign results that the first one knows nothing about.

app = "maze-monad"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  MAZE_DATA_DIR = "/data"

[[mounts]]
  source = "maze_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The server cashes out and settles games on its own: it must run with no request in sight.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Answers 200 only once the boot (with the chain catch-up) is done and while the event log is
  # writable and the settlement worker completes its passes.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
